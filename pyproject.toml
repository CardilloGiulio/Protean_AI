[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protean-workspace"
version = "0.6.1rc2"
description = "A local-first character roleplay studio with bounded character research, persistent chats, and encrypted provider credentials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=46,<48",
    "fastapi>=0.128,<1.0",
    "httpx>=0.28,<1.0",
    "PyJWT>=2.10,<3.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",
    "Pillow>=11,<13",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protean_workspace = [
    "static/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/assets/*.webp",
    "static/assets/*.png",
    "static/assets/*.svg",
    "static/assets/immersion/*.json",
    "static/assets/immersion/backgrounds/*.webp",
    "static/assets/immersion/sprites/*/*.webp",
    "static/assets/assistant/*.json",
    "static/assets/assistant/sprites/*/*/*.webp",
    "assistant_shell/*.html",
    "assistant_shell/*.css",
    "assistant_shell/*.js",
    "assistant_shell/*.json",
    "data/context/*.txt",
    "data/context/*.csv",
    "data/library/characters/*/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
