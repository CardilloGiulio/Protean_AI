<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Protean Workspace — Immersion Mode">
  <meta name="theme-color" content="#050608">
  <title>Immersion · Protean Workspace</title>
  <link rel="icon" href="/static/assets/protean-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/immersion.css">
</head>
<body>
  <main id="loadingGate" class="loading-gate">
    <img src="/static/assets/protean-icon.svg" alt="" class="loading-mark">
    <strong>Entering Immersion…</strong>
  </main>

  <main id="immersionShell" class="immersion-shell" hidden>
    <div class="scene-background" aria-hidden="true">
      <img id="backgroundA" class="background-layer active" alt="">
      <img id="backgroundB" class="background-layer" alt="">
      <div class="background-grade"></div>
    </div>

    <header class="immersion-hud">
      <button id="backButton" class="hud-button back-button" type="button" aria-label="Back to Protean Workspace">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/><path d="M9 12h11"/></svg>
        <span>Back</span>
      </button>

      <div class="session-identity">
        <span id="characterName" class="character-name"></span>
        <div class="session-locks" aria-label="Locked Immersion setup">
          <span id="phaseName"></span>
          <span id="scenarioName"></span>
          <span id="toneName"></span>
        </div>
      </div>

      <div class="scene-status">
        <span class="lock-dot" aria-hidden="true"></span>
        <span id="sceneLabel">Scene locked</span>
      </div>
    </header>

    <section id="characterStage" class="character-stage" aria-hidden="true">
      <img id="characterSprite" class="character-sprite" alt="">
    </section>

    <section class="immersion-chat" aria-label="Immersive conversation">
      <div id="messages" class="immersion-messages" aria-live="polite"></div>
      <form id="composer" class="immersion-composer">
        <textarea id="messageInput" rows="1" placeholder='() Dev · "" Speech · ** Action' aria-label="Message"></textarea>
        <button id="sendButton" type="submit" class="send-button" aria-label="Send">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Z"/><path d="M7 12h14"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="/static/js/immersion.js"></script>
</body>
</html>
